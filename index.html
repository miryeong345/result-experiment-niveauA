<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>식물 실험 결과지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Gothic+A1:wght@400;500;700&display=swap">
<style>
/* Layout: one-thing-per-screen wizard. Home → choose experiment → 7 big steps → result sheet image. Large touch targets for students with special needs. */
:root{
  --bg:#F3F6EE; --surface:#FFFFFF; --surface-2:#E9F0E1; --ink:#1E2B1F; --ink-soft:#55635A; --line:#CBD7C1;
  --leaf:#2F7D3B; --leaf-soft:#DDEFD8; --dye:#C42339; --dye-soft:#FBE2E6; --water:#2A78C2; --water-soft:#DCEAF8;
  --root-b:#C96F1C; --root-b-soft:#FBEAD7; --ok:#2F7D3B; --ok-soft:#DDEFD8; --warn:#B8560F; --warn-soft:#FCEBDD;
  --accent:var(--leaf); --accent-soft:var(--leaf-soft);
  --display:"IBM Plex Sans KR","Gothic A1",system-ui,sans-serif; --body:"Gothic A1",system-ui,-apple-system,sans-serif; --grid:#DFE8E3;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131915; --surface:#1C241E; --surface-2:#243027; --ink:#EAF1E6; --ink-soft:#A8B6AA; --line:#36463A;
  --leaf:#6CC27A; --leaf-soft:#1E3923; --dye:#FF7486; --dye-soft:#3F1D24; --water:#6BB1F0; --water-soft:#16314A;
  --root-b:#F0A35A; --root-b-soft:#3C2916; --ok:#6CC27A; --ok-soft:#1E3923; --warn:#F2A25E; --warn-soft:#3C2816; --grid:#1F2A22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1C241E; --surface-2:#243027; --ink:#EAF1E6; --ink-soft:#A8B6AA; --line:#36463A;
  --leaf:#6CC27A; --leaf-soft:#1E3923; --dye:#FF7486; --dye-soft:#3F1D24; --water:#6BB1F0; --water-soft:#16314A;
  --root-b:#F0A35A; --root-b-soft:#3C2916; --ok:#6CC27A; --ok-soft:#1E3923; --warn:#F2A25E; --warn-soft:#3C2816; --grid:#1F2A22; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
#app{max-width:860px;margin:0 auto}
#app[data-exp="lily"],#nav[data-exp="lily"]{--accent:var(--dye);--accent-soft:var(--dye-soft)}
#app[data-exp="onion"]{--accent:var(--leaf);--accent-soft:var(--leaf-soft)}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(32px,6.5vw,44px);letter-spacing:-.02em}
h2{font-size:clamp(26px,5vw,32px);letter-spacing:-.01em}
h3{font-size:22px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label.upload:focus-within{outline:4px solid var(--water);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:20px}
.soft{color:var(--ink-soft)}

/* home */
.hero{display:flex;flex-direction:column;gap:8px;padding-block:8px 4px}
.hero p{font-size:20px;color:var(--ink-soft)}
.who{display:grid;grid-template-columns:2fr 1fr;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.who label{display:flex;flex-direction:column;gap:6px;font-weight:700;min-width:0}
.who input{font:inherit;font-size:22px;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.expcard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:22px 14px 20px;transition:transform .15s,border-color .15s}
.expcard:hover{transform:translateY(-3px)}
.expcard.lily{border-color:color-mix(in srgb,var(--dye) 45%,var(--line))}
.expcard.onion{border-color:color-mix(in srgb,var(--leaf) 45%,var(--line))}
.expcard svg{width:130px;height:130px}
.expcard .nm{font-family:var(--display);font-weight:700;font-size:26px}
.expcard .q{color:var(--ink-soft);font-size:17px}
.expcard .go{margin-top:4px;font-weight:700;padding:10px 22px;border-radius:999px;color:#fff;font-size:19px}
.expcard.lily .go{background:var(--dye)} .expcard.onion .go{background:var(--leaf)}
:root[data-theme="dark"] .expcard .go{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .expcard .go{color:#111}}
.badge{font-size:15px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft)}

/* flow */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.home-btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:17px}
.topbar .t{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent)}
.steps{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:16px;color:var(--ink-soft)}
.chip .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-size:13px}
.chip.done .n{background:var(--ok);color:var(--surface)}
.chip.cur{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head .sub{font-size:20px;color:var(--ink-soft);margin-top:6px}
.say{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:2px solid var(--water);color:var(--water);background:var(--water-soft);border-radius:999px;padding:8px 14px;font-weight:700;font-size:16px}
.say svg{width:22px;height:22px}
.qtitle{font-family:var(--display);font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px}
.qtitle .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.section{display:flex;flex-direction:column;gap:12px}

.choices{display:grid;gap:12px}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choices.c4{grid-template-columns:repeat(4,1fr)}
.choices.c2{grid-template-columns:repeat(2,1fr)}
.choices.c1{grid-template-columns:1fr}
.choice{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:64px;padding:14px 12px;border:3px solid var(--line);border-radius:16px;background:var(--surface);font-weight:700;font-size:18px;text-align:center;transition:transform .1s}
.choice:active{transform:scale(.97)}
.choice.row{flex-direction:row;justify-content:flex-start;text-align:left;padding:14px 18px}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-pressed="true"]::after{content:"✓";position:absolute;top:-12px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-size:17px}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right::after{background:var(--ok)}
.choice.wrong{border-color:var(--warn);background:var(--warn-soft)}
.choice.wrong::after{content:"!";background:var(--warn)}
.swatch{width:54px;height:54px;border-radius:50%;border:3px solid rgba(0,0,0,.12)}
.face{font-size:40px;line-height:1}

.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:200px;border:3px dashed var(--accent);border-radius:20px;background:var(--accent-soft);cursor:pointer;text-align:center;padding:18px;font-weight:700;font-size:21px}
.upload svg{width:56px;height:56px;color:var(--accent)}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.photo{display:flex;flex-direction:column;gap:10px}
.photo img{width:100%;max-height:360px;object-fit:contain;border-radius:16px;background:var(--surface-2)}
.photo .acts{display:flex;gap:10px;flex-wrap:wrap}
.pgroup{border:3px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.pgroup.before{border-color:color-mix(in srgb,var(--leaf) 45%,var(--line))}
.pgroup.after{border-color:color-mix(in srgb,var(--dye) 45%,var(--line))}
.pgh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:19px}
.pgh .soft{font-size:16px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pslot{display:flex;flex-direction:column;gap:6px;min-width:0}
.plabel{font-weight:700;font-size:17px}
.upload.sm{min-height:150px;font-size:18px;padding:10px;gap:6px}
.upload.sm svg{width:40px;height:40px}
.upload.sm .soft{display:none}
.pslot .photo img,.pview{width:100%;height:170px;max-height:none;object-fit:contain;border-radius:14px;background:var(--surface-2)}
.pslot .acts{gap:6px}.pslot .small-btn{padding:6px 10px;font-size:15px}
.pempty{height:120px;display:grid;place-items:center;border-radius:14px;background:var(--surface-2);color:var(--ink-soft);font-size:16px}
.small-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.small-btn input{position:absolute;opacity:0;width:1px;height:1px}

textarea{font:inherit;font-size:19px;width:100%;min-height:90px;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);resize:vertical}

.ol{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ol li{display:flex;gap:12px;align-items:flex-start;font-size:20px}
.ol .num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.illus{display:flex;justify-content:center;background:var(--surface-2);border-radius:20px;padding:14px}
.illus svg{width:100%;max-width:340px;height:auto}

/* onion pair */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.plant{border:3px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.plant.A{border-color:color-mix(in srgb,var(--leaf) 50%,var(--line))}
.plant.B{border-color:color-mix(in srgb,var(--root-b) 50%,var(--line))}
.tag{align-self:flex-start;font-weight:700;font-size:17px;padding:4px 12px;border-radius:999px}
.A .tag{background:var(--leaf-soft);color:var(--leaf)} .B .tag{background:var(--root-b-soft);color:var(--root-b)}
.cylwrap{display:flex;gap:10px;align-items:center;justify-content:center}
.cylwrap svg{width:96px;height:auto;flex:0 0 auto}
.val{font-family:var(--display);font-weight:700;font-size:32px;text-align:center;font-variant-numeric:tabular-nums}
.val small{font-size:18px;color:var(--ink-soft);margin-left:3px}
.startbox{display:flex;align-items:center;justify-content:center;gap:24px}
.cylwrap.big svg{width:140px}
.val.big{font-size:52px}
.bigstep{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bigstep button{min-height:60px;border-radius:16px;border:3px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.bigstep button:active{transform:scale(.96)}
.bigstep button:nth-child(-n+2){color:var(--root-b)} .bigstep button:nth-child(n+3){color:var(--water)}
.startrange{width:100%;accent-color:var(--water);height:36px}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.presets .soft{font-size:16px;margin-right:4px}
.presets .small-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stepper button{flex:1 1 0;min-width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:var(--surface);font-size:26px;font-weight:700;line-height:1}
.stepper input[type=range]{order:3;flex:1 1 100%;min-width:0;accent-color:var(--water);height:32px}
.plant .choices{grid-template-columns:1fr 1fr;gap:8px}
.plant .choice{min-height:56px;font-size:15px;padding:8px 6px;gap:4px}
.plant .choice svg{width:34px;height:34px}

/* result */
.rtable{overflow-x:auto}
.rtable table{border-collapse:separate;border-spacing:8px;width:100%;min-width:420px}
.rtable th{font-family:var(--display);font-weight:700;font-size:18px}
.rtable td{text-align:center;background:var(--surface-2);border-radius:14px;padding:10px 6px;font-weight:700;font-size:16px}
.rtable td .swatch{width:40px;height:40px;margin:0 auto 4px}
.rtable td img{width:100%;max-width:150px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;margin:0 auto}
.say-box{background:var(--accent-soft);border-radius:18px;padding:18px 20px;font-size:21px;font-weight:700;display:flex;gap:12px;align-items:flex-start}
.say-box .ico{flex:0 0 auto;font-size:26px;line-height:1.2}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compare .plant{align-items:center;text-align:center}
.drop{font-family:var(--display);font-weight:700;font-size:24px}
.drop.big{color:var(--water)}
.fb{font-weight:700;font-size:19px;padding:12px 16px;border-radius:14px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--warn-soft);color:var(--warn)}
.concept{border:3px solid var(--ok);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.concept .lb{font-family:var(--display);font-weight:700;color:var(--ok);font-size:20px}
.concept p{font-size:21px;font-weight:700}
.sheet{display:flex;flex-direction:column;gap:14px;align-items:center}
.sheet img{width:100%;border-radius:12px;border:2px solid var(--line);background:#fff}
.save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;border:none;border-radius:20px;background:var(--water);color:#fff;font-family:var(--display);font-weight:700;font-size:24px}
.save svg{width:30px;height:30px}
.msg{font-weight:700;text-align:center}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-top:2px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .in{max-width:860px;margin:0 auto;display:flex;gap:12px}
.nav button{flex:1;min-height:62px;border-radius:18px;font-family:var(--display);font-weight:700;font-size:23px;border:3px solid var(--line);background:var(--surface)}
.nav .next{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.reset-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}
.link-btn{border:none;background:none;color:var(--ink-soft);text-decoration:underline;font-size:16px;padding:8px}
.danger{border:2px solid var(--warn);color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:8px 14px;font-weight:700;font-size:16px}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .35s ease}
.shake{animation:shake .3s ease}
@media (prefers-reduced-motion: reduce){.pop,.shake{animation:none}.expcard{transition:none}}

@media (max-width:560px){
  body{font-size:18px}
  .who{grid-template-columns:1fr}
  .pick{grid-template-columns:1fr}
  .choices.c4{grid-template-columns:repeat(2,1fr)}
  .choices.c3{grid-template-columns:1fr}
  .choices.c3 .choice{flex-direction:row;justify-content:flex-start;padding:12px 16px}
  .card{padding:18px}
  .pair,.compare{gap:8px}
  .plant{padding:10px}
  .cylwrap svg{width:70px}
  .plant .choices{grid-template-columns:1fr}
  .plant .choice{flex-direction:row;justify-content:flex-start;text-align:left;padding:8px 10px}
  .plant .choice svg{width:28px;height:28px}
  .say span{display:none}
}
</style>

<div id="app"></div>
<div class="nav" id="nav" hidden><div class="in"><button id="prev" type="button">◀ 이전</button><button id="next" class="next" type="button">다음 ▶</button></div></div>

<script>
(function(){
"use strict";

const GROW=[{id:'none',label:'그대로예요'},{id:'little',label:'조금 자랐어요'},{id:'lot',label:'많이 자랐어요'},{id:'wilt',label:'시들었어요'}];

const LPRED=[{id:'red',label:'줄기와 잎이 빨갛게 변해요'},{id:'same',label:'색이 그대로예요'},{id:'unknown',label:'잘 모르겠어요'}];

 {q:'빨간 물은 어디로 갔나요?',opts:[{id:'up',t:'줄기를 따라 잎까지 올라갔어요'},{id:'stay',t:'컵 안에 그대로 있어요'},{id:'down',t:'흙 속으로 내려갔어요'}],ans:'up',hint:'줄기와 잎의 색이 어떻게 변했는지 다시 보세요.'},
 {q:'줄기는 어떤 일을 할까요?',opts:[{id:'path',t:'물이 이동하는 길이에요'},{id:'flower',t:'꽃잎을 만들어요'},{id:'nothing',t:'아무 일도 안 해요'}],ans:'path',hint:'빨간 물이 줄기를 지나서 잎까지 갔어요.'}];

 {q:'어느 쪽 물이 더 많이 줄었나요?',opts:[{id:'A',t:'뿌리 있는 파의 물'},{id:'B',t:'뿌리 없는 파의 물'},{id:'same',t:'똑같이 줄었어요'}],ans:null,hint:'결과 화면의 눈금실린더를 다시 보세요.'},
 {q:'뿌리는 어떤 일을 할까요?',opts:[{id:'absorb',t:'물을 흡수해요 (빨아들여요)'},{id:'make',t:'물을 만들어요'},{id:'nothing',t:'아무 일도 안 해요'}],ans:'absorb',hint:'뿌리가 있는 파의 물이 더 많이 줄었어요.'}];
const OCONCEPT='뿌리는 식물에 필요한 물을 흡수해요. 그래서 뿌리가 있는 파의 물이 더 많이 줄어들었어요.';

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fresh(){return{
  name:'',date:today(),
  lily:{predict:null,photos:{bw:null,bc:null,aw:null,ac:null},stem:null,leaf:null,memo:'',a:[null,null],feel:null,note:''},
  onion:{start:150,predict:null,photo:null,wA:null,wB:null,gA:null,gB:null,a:[null,null],feel:null,note:''},
  view:{screen:'home',exp:null,step:0}}}
let S;
try{S=JSON.parse(localStorage.getItem(STORE))}catch(e){S=null}
if(!S||!S.lily||!S.onion)S=fresh();
if(!S.lily.photos)S.lily.photos={bw:null,bc:null,aw:null,ac:null};
let saveT;
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){
  try{const c=JSON.parse(JSON.stringify(S));c.lily.photos={};c.onion.photo=null;localStorage.setItem(STORE,JSON.stringify(c))}catch(e2){}}},300)}

const app=document.getElementById('app'),nav=document.getElementById('nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const canSpeak='speechSynthesis' in window;
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const ICON_SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>';
const ICON_SAVE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>';
function sayBtn(text){return canSpeak?`<button type="button" class="say" data-act="say" data-text="${esc(text)}">${ICON_SPK}<span>읽어 줘요</span></button>`:''}

/* ---------- illustrations ---------- */
function lilySVG(red){const s=red?'#C42339':'#5DA34B',l=red?'#B9475A':'#6BB257';return `<svg viewBox="0 0 200 200" aria-hidden="true">
<path d="M70 120 L70 150 L45 190 L155 190 L130 150 L130 120 Z" fill="#E7F1FA" stroke="#7A9BB8" stroke-width="4" stroke-linejoin="round"/>
<path d="M58 165 L142 165 L152 186 L48 186 Z" fill="#E0465B" opacity=".85"/>
<path d="M100 186 C100 140 101 90 100 50" stroke="${s}" stroke-width="7" fill="none" stroke-linecap="round"/>
<ellipse cx="78" cy="98" rx="24" ry="8" transform="rotate(-30 78 98)" fill="${l}"/>
<ellipse cx="124" cy="80" rx="24" ry="8" transform="rotate(30 124 80)" fill="${l}"/>
<path d="M100 52 C80 40 70 20 76 8 C88 18 96 30 100 44 C104 30 112 18 124 8 C130 20 120 40 100 52Z" fill="${red?'#F6C9D1':'#FFFFFF'}" stroke="#C9B9A6" stroke-width="3"/>
<path d="M100 50 C96 34 98 18 100 6 C102 18 104 34 100 50Z" fill="${red?'#F2AFBD':'#FAF6EE'}" stroke="#C9B9A6" stroke-width="2"/></svg>`}
function onionSVG(){return `<svg viewBox="0 0 200 200" aria-hidden="true">
${[40,120].map((x,i)=>`<rect x="${x}" y="40" width="44" height="150" rx="6" fill="#E7F1FA" stroke="#7A9BB8" stroke-width="4"/>
<rect x="${x+3}" y="${i?92:118}" width="38" height="${i?95:69}" fill="#7DB6E6" opacity=".7"/>
<line x1="${x-4}" y1="92" x2="${x+10}" y2="92" stroke="#C42339" stroke-width="4"/>
<path d="M${x+16} 20 L${x+16} 120 M${x+22} 10 L${x+22} 120 M${x+28} 22 L${x+28} 120" stroke="#4E9A3E" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="${x+22}" cy="140" rx="13" ry="18" fill="#FBFBF5" stroke="#CFC8B4" stroke-width="3"/>
${i===0?`<path d="M${x+14} 156 q-4 14 -2 26 M${x+20} 158 q0 14 -4 26 M${x+26} 158 q2 14 6 24 M${x+31} 155 q4 12 2 26" stroke="#E8DFC5" stroke-width="2.5" fill="none"/>`:''}`).join('')}
<text x="62" y="30" text-anchor="middle" font-size="0">A</text></svg>`}
function cylSVG(v,start){const top=14,bot=196,H=bot-top;const y=val=>bot-(Math.max(0,Math.min(200,val))/200)*H;
  let ticks='';for(let t=0;t<=200;t+=50){ticks+=`<line x1="18" y1="${y(t)}" x2="30" y2="${y(t)}" stroke="currentColor" stroke-width="2"/><text x="14" y="${y(t)+5}" text-anchor="end" font-size="13" fill="currentColor">${t}</text>`}
  return `<svg viewBox="-16 0 112 206" aria-hidden="true" style="color:var(--ink-soft)">
  <rect x="18" y="${top-4}" width="60" height="${H+4}" rx="6" fill="var(--water-soft)" opacity=".35" stroke="currentColor" stroke-width="3"/>
  <rect class="wtr" x="21" y="${y(v)}" width="54" height="${bot-y(v)}" fill="var(--water)" opacity=".75"/>
  ${ticks}
  <line x1="12" y1="${y(start)}" x2="84" y2="${y(start)}" stroke="var(--dye)" stroke-width="3.5" stroke-dasharray="6 4"/>
  </svg>`}
function sproutSVG(id){const c={none:'M17 30 V18',little:'M17 30 V12',lot:'M17 30 V4',wilt:'M17 30 V18 Q17 12 26 14'}[id];
  return `<svg viewBox="0 0 34 34" aria-hidden="true"><ellipse cx="17" cy="30" rx="8" ry="3" fill="var(--line)"/><path d="${c}" stroke="${id==='wilt'?'var(--root-b)':'var(--leaf)'}" stroke-width="4" fill="none" stroke-linecap="round"/>${id==='lot'?'<path d="M17 16 L10 9 M17 12 L24 6" stroke="var(--leaf)" stroke-width="3.5" stroke-linecap="round"/>':''}</svg>`}

/* ---------- helpers ---------- */
const E=()=>S[S.view.exp];
function choice(group,val,cur,inner,cls=''){return `<button type="button" class="choice ${cls}" data-act="pick" data-g="${group}" data-v="${val}" aria-pressed="${cur===val}">${inner}</button>`}
const LPH=[{g:'색소 물에 꽂지 않은 백합',sub:'비교용',items:[['bw','전체 모습'],['bc','줄기 단면']]},{g:'색소 물에 꽂아 둔 백합',sub:'실험용',items:[['aw','전체 모습'],['ac','줄기 단면']]}];
function getPhoto(key){const[x,k]=key.split('.');return k?S[x].photos[k]:S[x].photo}
function setPhoto(key,v){const[x,k]=key.split('.');if(k)S[x].photos[k]=v;else S[x].photo=v}
function lilyPhotos(){return `<div class="section"><div class="qtitle"><span class="dot"></span>실험 사진 4장 <span class="soft" style="font-size:16px;font-family:var(--body)">(없으면 비워도 돼요)</span></div>
  ${LPH.map((g,gi)=>`<div class="pgroup ${gi?'after':'before'}"><div class="pgh"><b>${g.g}</b><span class="soft">${g.sub}</span></div>
  <div class="pgrid">${g.items.map(([k,lb])=>`<div class="pslot"><span class="plabel">${lb}</span>${photoBlock('lily.'+k,S.lily.photos[k],true)}</div>`).join('')}</div></div>`).join('')}</div>`}
function lilyPhotoView(){if(!Object.values(S.lily.photos).some(Boolean))return '';
  return LPH.map((g,gi)=>`<div class="pgroup ${gi?'after':'before'}"><div class="pgh"><b>${g.g}</b><span class="soft">${g.sub}</span></div><div class="pgrid">${g.items.map(([k,lb])=>`<div class="pslot"><span class="plabel">${lb}</span>${S.lily.photos[k]?`<img class="pview" src="${S.lily.photos[k]}" alt="${g.g} ${lb}">`:'<div class="pempty">사진 없음</div>'}</div>`).join('')}</div></div>`).join('')}
function photoBlock(key,photo,small){
  if(photo)return `<div class="photo"><img src="${photo}" alt="올린 사진"><div class="acts">
  <label class="small-btn">${ICON_CAM.replace('<svg','<svg width="22" height="22"')} 사진 바꾸기<input type="file" accept="image/*" data-photo="${key}"></label>
  <button type="button" class="small-btn" data-act="delphoto" data-k="${key}">사진 지우기</button></div></div>`;
  return `<label class="upload${small?' sm':''}">${ICON_CAM}<span>사진 올리기</span><span class="soft" style="font-size:16px;font-weight:500">눌러서 사진을 골라요</span><input type="file" accept="image/*" data-photo="${key}"></label>`}
function colorLabel(id){return (LILY_COLORS.find(c=>c.id===id)||{}).label}
function growLabel(id){return (GROW.find(c=>c.id===id)||{}).label}
function lastWater(o,k){return o['w'+k]}
function drops(){const o=S.onion,a=lastWater(o,'A'),b=lastWater(o,'B');return{a:a==null?null:o.start-a,b:b==null?null:o.start-b}}
function onionAns(){const d=drops();if(d.a==null||d.b==null)return'A';if(d.a>d.b)return'A';if(d.b>d.a)return'B';return'same'}
function qAns(i){return S.view.exp==='lily'?LQ[i].ans:(i===0?onionAns():OQ[1].ans)}
function stepDone(i){const e=E(),x=S.view.exp;
  if(i===0)return e.predict!=null;
  if(i===1||i===2)return x==='lily'?!!(e.stem&&e.leaf):!!(e.wA!=null&&e.wB!=null&&e.gA&&e.gB);
  if(i===3)return e.a[0]!=null&&e.a[1]!=null;
  return false}
function progress(x){const old=S.view.exp;S.view.exp=x;let n=0;for(let i=0;i<4;i++)if(stepDone(i))n++;S.view.exp=old;return n}

/* ---------- screens ---------- */
function render(){
  const v=S.view;app.dataset.exp=v.exp||'';nav.dataset.exp=v.exp||'';
  if(v.screen==='home'){nav.hidden=true;app.innerHTML=homeHTML();return}
  nav.hidden=false;
  document.getElementById('prev').style.visibility=v.step===0?'hidden':'visible';
  document.getElementById('next').hidden=v.step===STEPS.length-1;
  const title=v.exp==='lily'?'백합 줄기 실험':'파 뿌리 실험';
  app.innerHTML=`<div class="stack">
   <div class="topbar"><button type="button" class="home-btn" data-act="home">⌂ 처음 화면</button><span class="t">${title}</span></div>
   <div class="steps" role="tablist">${STEPS.map((s,i)=>`<button type="button" class="chip ${i===v.step?'cur':''} ${stepDone(i)?'done':''}" data-act="go" data-i="${i}" aria-current="${i===v.step}"><span class="n">${stepDone(i)?'✓':i+1}</span>${s}</button>`).join('')}</div>
   <div class="card" id="card">${(v.exp==='lily'?lilyStep:onionStep)(v.step)}</div>
  </div>`;
  const cur=app.querySelector('.chip.cur');if(cur)cur.scrollIntoView({block:'nearest',inline:'center'});
  if(v.step===STEPS.length-1)buildSheet();
}
function homeHTML(){const pl=progress('lily'),po=progress('onion');
  return `<div class="stack">
  <div class="hero"><h1>식물 실험 결과지</h1><p>실험을 고르고, 실험이 끝난 모습을 관찰하고, 결과지를 만들어요.</p></div>
  <div class="who"><label for="nm">내 이름<input id="nm" data-f="name" value="${esc(S.name)}" placeholder="이름을 써요" autocomplete="off"></label>
  <label for="dt">날짜<input id="dt" type="date" data-f="date" value="${esc(S.date)}"></label></div>
  <h2 style="font-size:26px">어떤 실험을 할까요?</h2>
  <div class="pick">
   <button type="button" class="expcard lily" data-act="open" data-x="lily">${lilySVG(true)}<span class="nm">백합 줄기 실험</span><span class="q">줄기는 무슨 일을 할까?</span>${pl?`<span class="badge">${pl} / 4 했어요</span>`:''}<span class="go">${pl?'이어서 하기':'시작하기'}</span></button>
   <button type="button" class="expcard onion" data-act="open" data-x="onion">${onionSVG()}<span class="nm">파 뿌리 실험</span><span class="q">뿌리는 무슨 일을 할까?</span>${po?`<span class="badge">${po} / 4 했어요</span>`:''}<span class="go">${po?'이어서 하기':'시작하기'}</span></button>
  </div>
  <div class="reset-row" id="resetrow"><button type="button" class="link-btn" data-act="askreset">기록 모두 지우기</button></div>
  </div>`}
function head(t,sub,read){return `<div class="head"><div><h2>${t}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>${sayBtn(read||(t+'. '+(sub||'')))}</div>`}

function lilyStep(i){const L=S.lily;
  if(i===0)return head('실험 준비','백합 줄기를 빨간 물에 넣었어요.')+
   `<div class="illus">${lilySVG(false)}</div>
   <ol class="ol"><li><span class="num">1</span>빨간 색소를 녹인 물을 준비해요.</li><li><span class="num">2</span>백합 줄기를 빨간 물에 넣어요.</li><li><span class="num">3</span>햇빛이 잘 드는 곳에 두어요.</li><li><span class="num">4</span>며칠 뒤, 줄기와 잎의 색을 봐요.</li></ol>
   <div class="section"><div class="qtitle"><span class="dot"></span>백합은 어떻게 될까요? (내 예상)</div>
   <div class="choices c3">${LPRED.map(p=>choice('predict',p.id,L.predict,p.label)).join('')}</div></div>`;
  if(i===1)return head('관찰하기','두 백합을 비교해요. 사진을 올리고 색을 골라요.')+lilyPhotos()+
   `<div class="section"><div class="qtitle"><span class="dot"></span>줄기는 무슨 색이 되었나요?</div>
   <div class="choices c4">${LILY_COLORS.map(c=>choice('stem',c.id,L.stem,`<span class="swatch" style="background:${c.hex}"></span>${c.label}`)).join('')}</div></div>
   <div class="section"><div class="qtitle"><span class="dot"></span>잎은 무슨 색이 되었나요?</div>
   <div class="choices c4">${LILY_COLORS.map(c=>choice('leaf',c.id,L.leaf,`<span class="swatch" style="background:${c.hex}"></span>${c.label}`)).join('')}</div></div>
   <div class="section"><label class="qtitle" for="memo"><span class="dot"></span>더 본 것 <span class="soft" style="font-size:17px;font-family:var(--body)">(안 써도 돼요)</span></label>
   <textarea id="memo" data-f="memo" placeholder="예) 잎에 빨간 줄이 보여요">${esc(L.memo)}</textarea></div>`;
  if(i===2){const s=lilySentence();
   return head('결과 보기','처음과 비교해서 색이 어떻게 변했나요?',s)+
   lilyPhotoView()+
   `<div class="rtable"><table><thead><tr><th></th><th>처음</th><th></th><th>실험 뒤</th></tr></thead><tbody>
   <tr><th>줄기</th>${swCell('green')}<td style="background:none;font-size:28px">→</td>${swCell(L.stem)}</tr>
   <tr><th>잎</th>${swCell('green')}<td style="background:none;font-size:28px">→</td>${swCell(L.leaf)}</tr></tbody></table></div>
   <div class="say-box"><span class="ico">🔎</span><span>${esc(s)}</span></div>`}
  if(i===3)return conclHTML(LQ,LCONCEPT,L);
  return sheetHTML();
}
function photoSec(x){return `<div class="section"><div class="qtitle"><span class="dot"></span>실험 사진 <span class="soft" style="font-size:17px;font-family:var(--body)">(없으면 안 올려도 돼요)</span></div>${photoBlock(x,S[x].photo)}</div>`}
function swCell(id){const c=LILY_COLORS.find(x=>x.id===id);return `<td>${c?`<span class="swatch" style="background:${c.hex};display:block"></span>${c.label}`:'<span class="soft">—</span>'}</td>`}
function lilySentence(){const L=S.lily;if(!L.stem&&!L.leaf)return '아직 관찰 기록이 없어요. 관찰하기에서 색을 골라 주세요.';
  const part=(nm,id)=>!id?'':(id==='green'?`${nm} 실험 뒤에도 초록색 그대로였어요.`:`처음에 초록색이던 ${nm} ${colorLabel(id)}으로 변했어요.`);
  return [part(L.stem==='green'?'줄기는':'줄기가',L.stem),part(L.leaf==='green'?'잎은':'잎이',L.leaf)].filter(Boolean).join(' ')}

function onionStep(i){const O=S.onion;
  if(i===0)return head('실험 준비','파 두 개를 물에 넣고 비교해요.')+
   `<div class="illus">${onionSVG()}</div>
   <div class="pair"><div class="plant A"><span class="tag">A 뿌리 있는 파</span><span style="font-size:17px">잎만 잘라요.</span></div><div class="plant B"><span class="tag">B 뿌리 없는 파</span><span style="font-size:17px">잎과 뿌리를 잘라요.</span></div></div>
   <ol class="ol"><li><span class="num">1</span>눈금실린더 두 개에 같은 양의 물을 넣어요.</li><li><span class="num">2</span>파를 넣고, 물 높이를 빨간 펜으로 표시해요.</li><li><span class="num">3</span>햇빛이 잘 드는 곳에 두고, 며칠 뒤에 봐요.</li></ol>
   <div class="section"><div class="qtitle"><span class="dot"></span>처음 물은 몇 mL였나요?</div>
   <div class="startbox"><div class="cylwrap big" id="startcyl">${cylSVG(O.start,O.start)}</div><div class="val big" id="sv">${O.start}<small>mL</small></div></div>
   <div class="bigstep">${[-10,-1,1,10].map(d=>`<button type="button" data-act="nud" data-k="start" data-d="${d}" aria-label="${Math.abs(d)} ${d<0?'줄이기':'늘리기'}">${d<0?'−':'+'}${Math.abs(d)}</button>`).join('')}</div>
   <input class="startrange" type="range" min="0" max="200" step="1" value="${O.start}" data-w="start" aria-label="처음 물 양">
   <div class="presets"><span class="soft">빨리 고르기</span>${[100,150,200].map(v=>`<button type="button" class="small-btn" data-act="setstart" data-v="${v}" aria-pressed="${O.start===v}">${v} mL</button>`).join('')}</div></div>
   <div class="section"><div class="qtitle"><span class="dot"></span>어느 쪽 물이 더 많이 줄어들까요? (내 예상)</div>
   <div class="choices c3">${OPRED.map(p=>choice('predict',p.id,O.predict,p.label)).join('')}</div></div>`;
  if(i===1){['A','B'].forEach(k=>{if(O['w'+k]==null)O['w'+k]=O.start});persist();
   return head('관찰하기','실험이 끝난 파를 봐요. 사진을 올리고, 물 높이와 자란 정도를 골라요.')+photoSec('onion')+
   `<div class="section"><div class="qtitle"><span class="dot"></span>물은 몇 mL 남았나요?</div>
   <p class="soft" style="font-size:17px">빨간 점선은 처음 물 높이예요.</p>
   <div class="pair">${['A','B'].map(k=>`<div class="plant ${k}" data-plant="${k}"><span class="tag">${k} ${k==='A'?'뿌리 있는 파':'뿌리 없는 파'}</span>
     <div class="cylwrap">${cylSVG(O['w'+k],O.start)}</div><div class="val" data-vv="${k}">${O['w'+k]}<small>mL</small></div>
     <div class="stepper"><button type="button" data-act="nud" data-k="w${k}" data-d="-1" aria-label="1 줄이기">−</button><input type="range" min="0" max="200" step="1" value="${O['w'+k]}" data-w="w${k}" aria-label="${k} 물 양"><button type="button" data-act="nud" data-k="w${k}" data-d="1" aria-label="1 늘리기">+</button></div>
     </div>`).join('')}</div></div>
   <div class="section"><div class="qtitle"><span class="dot"></span>파는 얼마나 자랐나요?</div>
   <div class="pair">${['A','B'].map(k=>`<div class="plant ${k}"><span class="tag">${k} ${k==='A'?'뿌리 있는 파':'뿌리 없는 파'}</span>
     <div class="choices">${GROW.map(g=>choice('g'+k,g.id,O['g'+k],sproutSVG(g.id)+g.label)).join('')}</div></div>`).join('')}</div></div>`}
